[project]
name = "second-hand-swag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.2",
    "apscheduler>=3.11.2",
    "attrs>=25.4.0",
    "dependency-injector>=4.48.3",
    "fastapi-cache2[in-memory,inmemory]>=0.2.2",
    "fastapi[standard]>=0.126.0",
    "inflection>=0.5.1",
    "jinja2>=3.1.6",
    "playwright>=1.57.0",
    "psycopg2>=2.9.11",
    "pydantic-settings>=2.12.0",
    "sentry-sdk[fastapi]>=2.48.0",
    "sqlalchemy>=2.0.45",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "polyfactory>=3.2.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-env>=1.2.0",
    "pytest-unordered>=0.7.0",
    "ruff>=0.14.10",
    "sqlalchemy-utils>=0.42.1",
    "types-factory-boy>=0.4.1",
    "types-sqlalchemy-utils>=1.1.0",
]

[tool.uv]
# This prevents 'uv run' and 'uv sync' from including dev dependencies by default
default-groups = []
