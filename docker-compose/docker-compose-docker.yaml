services:
  db:
    image: postgres:17
    restart: unless-stopped
    healthcheck:
      test: pg_isready -U postgres
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 2s
    env_file: ../src/env/.env.docker
    networks:
      - db_network
    volumes:
      - dbdata:/var/lib/postgresql/data
  browser:
    image: mcr.microsoft.com/playwright:v1.57.0-noble
    restart: unless-stopped
    networks:
      - browser_network
    healthcheck:
      test: node -e 'fetch("http://browser:9222/status").then(res => process.exit(+!res.ok)).catch(() => process.exit(1))'
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 2s
    command: npx playwright@1.57 run-server --port 9222 --host 0.0.0.0
  shs-migrations:
    build:
      context: ../
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    command: sh -c 'cd src/infrastructure/sqlalchemy && uv run alembic upgrade head'
    env_file: ../src/env/.env.docker
    networks:
      - db_network
    volumes:
      - dbdata:/var/lib/postgresql/data
  shs-backend:
    build:
      context: ../
      dockerfile: Dockerfile
    env_file: ../src/env/.env.docker
    networks:
      - db_network
      - backend_network
      - browser_network
    healthcheck:
      test: python -c 'import urllib.request; urllib.request.urlopen("http://shs-backend:8000/health")'
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 2s
    depends_on:
      browser:
        condition: service_healthy
      shs-migrations:
        condition: service_completed_successfully
    post_start:
      - command: sh -c 'uv run python3 -m scripts.create_users'
  api-gateway:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - backend_network
    volumes:
      - ../api_gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      shs-backend:
        condition: service_healthy
volumes:
  dbdata:
    driver: local
networks:
  db_network:
    driver: bridge
  backend_network:
    driver: bridge
  browser_network:
    driver: bridge
