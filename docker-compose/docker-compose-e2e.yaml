services:
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: pg_isready -U postgres
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 2s
    env_file: ../src/env/.env.e2e
    networks:
      - db_network
    volumes:
      - dbdata:/var/lib/postgresql/data
  migrations:
    build:
      context: ../
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    command: sh -c 'cd src/infrastructure/sqlalchemy && alembic upgrade head'
    env_file: ../src/env/.env.e2e
    networks:
      - db_network
    volumes:
      - dbdata:/var/lib/postgresql/data
  backend:
    build:
      context: ../
      dockerfile: Dockerfile
    env_file: ../src/env/.env.e2e
    networks:
      - db_network
      - backend_network
    healthcheck:
      test: python -c 'import urllib.request; urllib.request.urlopen("http://backend:8000/api/health")'
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 2s
    depends_on:
      migrations:
        condition: service_completed_successfully
  api-gateway:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - backend_network
    volumes:
      - ../api_gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
volumes:
  dbdata:
    driver: local
networks:
  db_network:
    driver: bridge
  backend_network:
    driver: bridge
